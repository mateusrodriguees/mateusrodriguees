<svg width="800" height="900" viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">

  <defs>
    <!-- Background -->
    <radialGradient id="bgGradient" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e1e2f"></stop>
      <stop offset="100%" stop-color="#0d0d14"></stop>
    </radialGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f5af0"></stop>
      <stop offset="100%" stop-color="#2cb67d"></stop>
    </linearGradient>

    <!-- Clip -->
    <clipPath id="clipCircle">
      <circle cx="400" cy="350" r="120"></circle>
    </clipPath>

<defs>
  <clipPath id="circleClip">
    <circle cx="400" cy="280" r="120" />
  </clipPath>
</defs>

<image
  href="https://github.com/mateusrodriguees.png"
  x="280"
  y="160"
  width="240"
  height="240"
  clip-path="url(#circleClip)"
  preserveAspectRatio="xMidYMid slice"
/>

  </defs>

  <!-- Fundo -->
  <rect width="800" height="900" fill="url(#bgGradient)"></rect>

  <!-- Moldura -->
  <circle cx="400" cy="350" r="130" fill="#111" stroke="url(#accentGradient)" stroke-width="3"></circle>

  <!-- Avatar -->
  <circle cx="400" cy="350" r="120" fill="url(#avatarPattern)" clip-path="url(#clipCircle)"></circle>

  <!-- Nome -->
  <text x="400" y="560" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial" font-size="42" font-weight="600">
    Mateus Rodrigues
  </text>

  <!-- Subtitle -->
  <text x="400" y="610" text-anchor="middle" fill="#cfcfcf" font-family="Segoe UI, Helvetica, Arial" font-size="20" opacity="0.8">
    A student of web techs and systems development
  </text>

