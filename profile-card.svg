<svg width="800" height="900" viewBox="0 0 800 900"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Background -->
    <radialGradient id="bgGradient" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e1e2f"/>
      <stop offset="100%" stop-color="#0d0d14"/>
    </radialGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f5af0"/>
      <stop offset="100%" stop-color="#2cb67d"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="800" height="900" fill="url(#bgGradient)"/>

  <!-- Moldura externa -->
  <circle cx="400" cy="350" r="150"
          fill="none"
          stroke="url(#accentGradient)"
          stroke-width="3"
          filter="url(#glow)"/>

  <!-- ÁTOMO FUTURISTA -->
  <g transform="translate(400,350)" filter="url(#glow)">

    <!-- Núcleo -->
    <circle r="20" fill="#7f5af0"/>

    <!-- Órbita 1 -->
    <ellipse rx="120" ry="40"
             fill="none"
             stroke="#2cb67d"
             stroke-width="2">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="6s"
        repeatCount="indefinite"/>
    </ellipse>

    <!-- Órbita 2 -->
    <ellipse rx="120" ry="40"
             fill="none"
             stroke="#00f5ff"
             stroke-width="2"
             transform="rotate(60)">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="60"
        to="420"
        dur="8s"
        repeatCount="indefinite"/>
    </ellipse>

    <!-- Órbita 3 -->
    <ellipse rx="120" ry="40"
             fill="none"
             stroke="#7f5af0"
             stroke-width="2"
             transform="rotate(-60)">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="-60"
        to="300"
        dur="10s"
        repeatCount="indefinite"/>
    </ellipse>

  </g>

  <!-- Nome -->
  <text x="400" y="600"
        text-anchor="middle"
        fill="#ffffff"
        font-family="Segoe UI, Helvetica, Arial"
        font-size="42"
        font-weight="600">
    Mateus Rodrigues
  </text>

  <!-- Subtitle -->
  <text x="400" y="650"
        text-anchor="middle"
        fill="#cfcfcf"
        font-family="Segoe UI, Helvetica, Arial"
        font-size="20"
        opacity="0.8">
    A student of web techs and systems development
  </text>

  <!-- GitHub -->
  <g transform="translate(280,700)">
    <path fill="#ffffff" d="M20 0C8.95 0 0 9 0 20c0 8.84 5.73 16.33 13.68 18.98 1 .18 1.37-.43 1.37-.96
      0-.47-.02-2.03-.03-3.69-5.56 1.21-6.73-2.68-6.73-2.68-.91-2.32-2.22-2.94-2.22-2.94
      -1.82-1.25.14-1.23.14-1.23 2.01.14 3.07 2.07 3.07 2.07
      1.79 3.06 4.7 2.18 5.84 1.67.18-1.3.7-2.18 1.27-2.68
      -4.44-.5-9.11-2.22-9.11-9.87 0-2.18.78-3.97 2.06-5.37
      -.21-.5-.89-2.52.2-5.25 0 0 1.68-.54 5.5 2.05
      1.6-.45 3.32-.67 5.03-.68 1.71.01 3.43.23 5.03.68
      3.82-2.59 5.5-2.05 5.5-2.05 1.09 2.73.41 4.75.2 5.25
      1.28 1.4 2.06 3.19 2.06 5.37 0 7.67-4.68 9.37-9.14 9.86
      .72.62 1.36 1.84 1.36 3.71 0 2.68-.02 4.84-.02 5.49
      0 .53.36 1.15 1.38.95C34.27 36.32 40 28.84 40 20
      40 9 31.05 0 20 0z"/>
    <text x="60" y="25"
          fill="#ffffff"
          font-family="Segoe UI, Helvetica, Arial"
          font-size="22"
          alignment-baseline="middle">
      mateusrodriguees
    </text>
  </g>

</svg>